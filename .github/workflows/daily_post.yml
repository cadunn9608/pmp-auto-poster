name: Daily PMP Post

on:
  schedule:
    - cron: '45 16 * * *'  # Runs daily at 8:00 AM PDT (3:00 PM UTC)
  workflow_dispatch:      # Allows manual trigger from GitHub

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run daily post script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          python -c '
          import os
          import time
          import random
          import requests
          from google import genai

          def make_bold(text):
              normal = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
              bold = "𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵"
              return text.translate(str.maketrans(normal, bold))

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          pmp_question_topics = [
              "agile team facilitation, servant leadership, and servant-leader mindset",
              "risk management, response strategies, and quantitative/qualitative risk analysis",
              "stakeholder engagement, communication planning, and managing expectations",
              "earned value management (EVM), schedule variance (SV), and cost variance (CV)",
              "change control procedures, integrated change control, and scope baseline management",
              "resource management, team charter, conflict resolution, and performance appraisals",
              "procurement management, contract types (fixed-price vs cost-reimbursable), and vendor selection",
              "quality management, cost of quality, process improvements, and quality control metrics",
              "agile ceremonies, backlog refinement, sprint planning, and velocity tracking",
              "project governance, compliance, benefits realization, and business value delivery"
          ]
          selected_question_topic = random.choice(pmp_question_topics)

          prompt = (
              f"Create an engaging, high-energy PMP exam practice post optimized for social media featuring EXACTLY ONE (1) "
              f"rigorous, situational multiple-choice question in the precise style of the actual PMP exam, specifically focused on: {selected_question_topic}.\n\n"
              "Structure the post using these exact plain text headings without markdown asterisks or emojis:\n"
              "PMP PRACTICE QUESTION OF THE DAY\n"
              "[Insert the single question and options A, B, C, D here]\n\n"
              "CORRECT ANSWER:\n"
              "[Provide the correct option and letter]\n\n"
              "THE PMP MINDSET BREAKDOWN:\n"
              "[Provide the concise mindset explanation]"
          )

          ai_text = None
          models_to_try = [
              "gemini-3.5-flash",
              "gemini-3.1-flash",
              "gemini-3.6-flash-001",
              "gemini-3-flash-preview",
              "gemini-3.1-flash-lite"
          ]

          for model_name in models_to_try:
              print(f"Attempting content generation using model: {model_name}")
              try:
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                  )
                  ai_text = response.text
                  print(f"Successfully generated content using {model_name}!")
                  break
              except Exception as e:
                  print(f"Model {model_name} failed with error: {e}. Trying next model...")
                  time.sleep(5)

          if not ai_text:
              raise Exception("All models failed to generate content due to high demand or server errors.")

          header1 = "🚨 " + make_bold("PMP PRACTICE QUESTION OF THE DAY") + " 🚨"
          header2 = "✅ " + make_bold("CORRECT ANSWER:")
          header3 = "🧠 " + make_bold("THE PMP MINDSET BREAKDOWN:")

          capm_link = "https://courses.velociteach.com/online-courses/capm-pta/?ref=nwvmngf&tm_daily_question=0806"
          
          capm_ctas = [
              "👇 " + make_bold("NOT QUITE READY FOR THE PMP? BUILD YOUR FOUNDATION FIRST!") + "\n" +
              f"Test your knowledge with the full 3-hour CAPM Practice Test from Velociteach for $89:\n{capm_link}",
              
              "👇 " + make_bold("BUILDING YOUR PROJECT MANAGEMENT CAREER?") + "\n" +
              f"The CAPM is the perfect stepping stone to the PMP. Try this comprehensive 3-hour practice exam from Velociteach:\n{capm_link}",
              
              "👇 " + make_bold("WANT TO TEST YOUR BASELINE KNOWLEDGE?") + "\n" +
              f"See where you stand with this complete 3-hour CAPM practice exam from Velociteach:\n{capm_link}"
          ]
          
          cta_block = "\n\n" + random.choice(capm_ctas)

          ai_text = ai_text.replace("PMP PRACTICE QUESTION OF THE DAY", header1)
          ai_text = ai_text.replace("Pmp Practice Question Of The Day", header1)
          ai_text = ai_text.replace("pmp practice question of the day", header1)

          ai_text = ai_text.replace("CORRECT ANSWER:", header2)
          ai_text = ai_text.replace("Correct Answer:", header2)
          ai_text = ai_text.replace("correct answer:", header2)

          ai_text = ai_text.replace("THE PMP MINDSET BREAKDOWN:", header3)
          ai_text = ai_text.replace("The Pmp Mindset Breakdown:", header3)
          ai_text = ai_text.replace("the pmp mindset breakdown:", header3)

          post_text = ai_text + cta_block

          app_id = os.environ["FACEBOOK_APP_ID"]
          app_secret = os.environ["FACEBOOK_APP_SECRET"]
          current_token = os.environ["FACEBOOK_ACCESS_TOKEN"]

          refresh_url = "https://graph.facebook.com/v18.0/oauth/access_token"
          refresh_params = {
              "grant_type": "fb_exchange_token",
              "client_id": app_id,
              "client_secret": app_secret,
              "fb_exchange_token": current_token
          }

          refresh_res = requests.get(refresh_url, params=refresh_params).json()

          if "access_token" in refresh_res:
              active_token = refresh_res["access_token"]
              print("Successfully refreshed token dynamically!")
          else:
              active_token = current_token
              print("Using existing token fallback.")

          page_id = os.environ["FACEBOOK_PAGE_ID"]
          post_url = f"https://graph.facebook.com/v18.0/{page_id}/feed"

          payload = {
              "message": post_text,
              "published": "true",
              "access_token": active_token
          }

          res = requests.post(post_url, data=payload)
          print("Facebook Response:", res.json())
          '
