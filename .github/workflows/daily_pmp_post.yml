name: Daily PMP Tip and Branded Image Post

on:
  schedule:
    - cron: '0 16 * * *'  # Runs daily at 9:00 AM PDT (4:00 PM UTC)
  workflow_dispatch:      # Allows manual trigger from GitHub

jobs:
  post-tip-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pillow

      - name: Run daily tip & branded image script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          python -c '
          import os
          import time
          import requests
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from google import genai
          from google.genai import types

          # Helper function for bold Unicode characters
          def make_bold(text):
              normal = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
              bold = "𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵"
              return text.translate(str.maketrans(normal, bold))

          # Initialize Gemini client
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          # 1. Generate the Daily PMP Tip Text
          tip_prompt = (
              "Create a short, punchy, high-value daily PMP exam study tip optimized for social media. "
              "Focus on a core project management principle, formula, or agile/predictive mindset concept. "
              "Output only the tip content without any Markdown formatting or emojis."
          )
          
          # Stable content generation (PMP Tip Text)
          response_text = client.models.generate_content(
              model="gemini-3.5-flash",
              contents=tip_prompt,
          )
          ai_tip_raw = response_text.text.strip()
          
          # Define formatting tags for the final post caption (to applymake_bold to parts of it)
          header_tag = "💡DAILY PMP TIP💡\n\n"
          ai_tip_formatted = make_bold(ai_tip_raw)

          # 2. Define standard style and animals. Pick two of your favorite animals for cute depiction.
          # We pick a Golden Retriever and a Koala for a friendly, engaging pair.
          animals_depiction = "a joyful voxel Golden Retriever and a curious koala"
          image_prompt = (
              f"A vibrant 3D pixel-art style illustration, isometric view, featuring {animals_depiction} "
              "learning together in a professional but friendly environment. Include small, charming voxel elements "
              "like a stack of project books, an agile board, and a tiny gavel, representing 'PMP success.' "
              "Vibrant professional colors."
          )
          
          print("Generating daily branded image...")
          result_img = client.models.generate_content(
              model="gemini-3.1-flash-image",
              contents=image_prompt,
              config=types.GenerateContentConfig(
                  response_modalities=["TEXT", "IMAGE"]
              )
          )

          image_path = "daily_pmp_tip.jpg"
          image_bytes = None
          for part in result_img.candidates[0].content.parts:
              if part.inline_data:
                  image_bytes = BytesIO(part.inline_data.data)
                  break

          if not image_bytes:
              raise Exception("Failed to generate and extract image bytes from Gemini response.")
          
          # 3. Use Pillow to overlay the PMP Tip Text on the Generated Image
          print("Overlaying PMP tip on image...")
          
          # Open the generated image with Pillow
          img = Image.open(image_bytes)
          width, height = img.size
          
          # Use a clear, large, modern bold font that is present in the standard runner
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", int(height * 0.03))
          except IOError:
              # Fallback font
              font = ImageFont.load_default()
              font_size = int(height * 0.03)
              print(f"Liberation Sans not found, using default font with simulated size: {font_size}")

          draw = ImageDraw.Draw(img)
          
          # Define a stylish text box position (bottom-center overlay with padding)
          text_box_w = int(width * 0.9)
          text_box_h = int(height * 0.1)
          text_box_y = height - text_box_h - int(height * 0.03)
          text_box_x = int((width - text_box_w) / 2)
          text_padding = int(text_box_h * 0.1)

          # Draw a semi-transparent dark overlay box for text contrast
          draw.rectangle(
              [text_box_x, text_box_y, text_box_x + text_box_w, text_box_y + text_box_h],
              fill=(0, 0, 0, 150),
              outline=(255, 255, 255, 50),
              width=1
          )

          # Define text wrapping logic and vertical centering in the box
          wrapped_text_lines = []
          for line in ImageDraw.Draw(img).textwrap.wrap(ai_tip_raw, text_box_w / ImageDraw.Draw(img).textbbox((0, 0), "A", font=font)[2]):
              wrapped_text_lines.append(line)
          
          # Simulate text box to find text height
          temp_img = Image.new("RGB", (text_box_w, text_box_h))
          temp_draw = ImageDraw.Draw(temp_img)
          wrapped_text_simulate = temp_draw.textwrap.wrap(ai_tip_raw, text_box_w / temp_draw.textbbox((0, 0), "A", font=font)[2])
          wrapped_simulate_str = "\n".join(wrapped_text_simulate)
          line_height = temp_draw.textbbox((0, 0), wrapped_text_simulate[0], font=font)[3]
          
          current_y = text_box_y + text_padding
          for line in wrapped_text_lines:
              # Center each line horizontally
              text_bbox = draw.textbbox((0, 0), line, font=font)
              text_w, text_h = text_bbox[2] - text_bbox[0], text_bbox[3] - text_bbox[1]
              current_x = text_box_x + (text_box_w - text_w) / 2
              # Apply text bold Unicode formatting within Pillow for visual impact
              pill_bold_line = line.translate(str.maketrans(
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",
                  "𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵"
              ))
              draw.text((current_x, current_y), pill_bold_line, fill="white", font=font)
              current_y += text_h + int(height * 0.005)

          # Save the final branded image
          img.save(image_path)
          print("Branded image successfully generated, overlaid, and saved!")

          # 4. Format Social Media Post Text (Caption for the photo)
          # Re-applymake_bold to final output text pieces securely. header_tag is clean.
          post_header = make_bold(header_tag)
          cta_block = (
              "\n\n👇 " + make_bold("READY TO PASS YOUR PMP EXAM ON THE FIRST TRY?") + "\n" +
              make_bold("Join 50,000 other students from 180 countries in top-rated training with Master of Project Academy:") + "\n" +
              "https://masterofproject.com/"
          )
          # Full formatted post_text for Facebook caption
          post_text = post_header + ai_tip_formatted + cta_block

          # 5. Exchange/Refresh Facebook Token
          app_id = os.environ["FACEBOOK_APP_ID"]
          app_secret = os.environ["FACEBOOK_APP_SECRET"]
          current_token = os.environ["FACEBOOK_ACCESS_TOKEN"]

          refresh_url = "https://graph.facebook.com/v18.0/oauth/access_token"
          refresh_params = {
              "grant_type": "fb_exchange_token",
              "client_id": app_id,
              "client_secret": app_secret,
              "fb_exchange_token": current_token
          }
          refresh_res = requests.get(refresh_url, params=refresh_params).json()
          active_token = refresh_res.get("access_token", current_token)

          # 6. Post the Branded Photo + Caption to Facebook Page Feed
          page_id = os.environ["FACEBOOK_PAGE_ID"]
          post_url = f"https://graph.facebook.com/v18.0/{page_id}/photos"

          with open(image_path, "rb") as img_file:
              files = {"source": img_file}
              payload = {
                  "caption": post_text,
                  "published": "true",
                  "access_token": active_token
              }
              res = requests.post(post_url, data=payload, files=files)
              print("Facebook Photo Post Response:", res.json())
          '
