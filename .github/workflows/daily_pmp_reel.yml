name: Daily PMP Reel Automation

on:
  schedule:
    # Runs automatically every day at 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1

      - name: Setup Wav2Lip & Download Required Weights
        run: |
          # Clone Wav2Lip if not already present in the repository
          if [ ! -d "Wav2Lip" ]; then
            git clone https://github.com/Rudrabha/Wav2Lip.git
          fi
          
          # Create directories for model weights
          mkdir -p Wav2Lip/checkpoints
          mkdir -p Wav2Lip/face_detection/detection/sfd
          
          # Download Wav2Lip GAN model weights if missing
          if [ ! -f "Wav2Lip/checkpoints/wav2lip_gan.pth" ]; then
            echo "Downloading wav2lip_gan.pth..."
            wget "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth" -O Wav2Lip/checkpoints/wav2lip_gan.pth
          fi
          
          # Download Face Detection model weights if missing
          if [ ! -f "Wav2Lip/face_detection/detection/sfd/s3fd.pth" ]; then
            echo "Downloading face detection model..."
            wget "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth" -O Wav2Lip/face_detection/detection/sfd/s3fd.pth
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Core generation & media packages
          pip install edge-tts google-genai pillow requests moviepy
          
          # Python 3.10-compatible machine learning & Wav2Lip dependencies
          pip install "numpy<2.0.0" "librosa>=0.9.0" opencv-python-headless torch torchvision torchaudio numba tqdm

      - name: Run PMP Reel Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          python generate_pmp_reel.py
