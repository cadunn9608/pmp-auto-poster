name: Daily PMP Reel Automation (Wav2Lip Edition)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Extended timeout for CPU lip-syncing
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-liberation
          # Fix ImageMagick security policy for MoviePy text rendering
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU versions of PyTorch to save space and avoid GPU driver issues
          pip install "torch<2.6" "torchvision<0.21" torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install audio/video processing and generation libraries
          pip install edge-tts moviepy requests google-genai pillow librosa==0.9.2 scipy opencv-python tqdm numba

      - name: Setup Wav2Lip
        run: |
          # Clone the Wav2Lip repository directly into the runner
          git clone https://github.com/Rudrabha/Wav2Lip.git
          cd Wav2Lip
          # Download the face detection model
          mkdir -p face_detection/detection/sfd
          wget "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth" -O face_detection/detection/sfd/s3fd.pth
          # Download the Wav2Lip GAN model (via Hugging Face mirror)
          mkdir -p checkpoints
          wget "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth" -O checkpoints/wav2lip_gan.pth

      - name: Run Daily PMP Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python generate_pmp_reel.py
