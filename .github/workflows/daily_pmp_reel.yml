name: Daily PMP Reel Automation (Image-to-Video)

on:
  schedule:
    - cron: '0 12 * * *'  # Runs automatically every day at 12:00 PM UTC
  workflow_dispatch:       # Allows manual trigger from GitHub Actions tab

jobs:
  generate-reel:
    runs-on: ubuntu-latest
    # Set timeout to 3 hours (180 minutes). Image generation and CPU video processing are slow.
    timeout-minutes: 180
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # Verify installation
          ffmpeg -version

      - name: Install Python Dependencies (Heavy ML Libraries)
        run: |
          python -m pip install --upgrade pip
          # 1. Install core numerical and deep learning libraries (restricted versions for CPU stability)
          pip install "numpy<2.0" "torch<2.6" "torchvision<0.21"
          # 2. Install Hugging Face ecosystem for Stable Diffusion + Accelerate for CPU offloading
          pip install diffusers transformers accelerate Pillow
          # 3. Install PMP automation requirements (INCLUDING GOOGLE-GENAI)
          pip install gtts moviepy requests google-genai

      - name: Run Daily PMP Script (Image Generation & Animation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }} # Required for StableDiffusionPipeline
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          # Optimization: Force PyTorch to use CPU and manage threads efficiently
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "4" # Utilize available cores without overloading
        run: |
          echo "Starting PMP Reel Generation at $(date -u +%H:%M:%S)"
          python generate_pmp_reel.py
          echo "Finished PMP Reel Generation at $(date -u +%H:%M:%S)"

      - name: Upload Generated Reel Artifact
        if: always() # Upload even if generation fails for debugging purposes
        uses: actions/upload-artifact@v4
        with:
          name: daily-pmp-reel
          path: daily_pmp_reel.mp4 
          retention-days: 7
