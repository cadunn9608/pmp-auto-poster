name: Daily PMP Reel Automation

on:
  schedule:
    # Runs automatically every day at 14:00 UTC (Adjust as needed)
    - cron: '0 14 * * *'
  workflow_dispatch:
    # Allows you to trigger the run manually from the GitHub Actions tab

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Wav2Lip & Download Required Weights
        run: |
          # Clone Wav2Lip if it isn't already in your repository
          if [ ! -d "Wav2Lip" ]; then
            git clone https://github.com/Rudrabha/Wav2Lip.git
          fi
          
          # Create directories for the weights
          mkdir -p Wav2Lip/checkpoints
          mkdir -p Wav2Lip/face_detection/detection/sfd
          
          # Download the Wav2Lip GAN model
          if [ ! -f "Wav2Lip/checkpoints/wav2lip_gan.pth" ]; then
            echo "Downloading wav2lip_gan.pth..."
            wget "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth" -O Wav2Lip/checkpoints/wav2lip_gan.pth
          fi
          
          # Download the Face Detection model (required by Wav2Lip)
          if [ ! -f "Wav2Lip/face_detection/detection/sfd/s3fd.pth" ]; then
            echo "Downloading face detection model..."
            wget "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth" -O Wav2Lip/face_detection/detection/sfd/s3fd.pth
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install core libraries for the script
          pip install edge-tts google-genai pillow requests moviepy
          
          # Install Wav2Lip specific dependencies (Torch, OpenCV, Librosa)
          pip install numpy opencv-python torch torchvision torchaudio librosa numba tqdm
          
          # Install any remaining Wav2Lip requirements (ignoring version conflicts to keep it CPU-friendly)
          pip install -r Wav2Lip/requirements.txt || echo "Using modern compatible versions for CPU"

      - name: Run PMP Reel Generation Script
        env:
          # These must be set in your GitHub Repository Settings -> Secrets and variables -> Actions
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python generate_pmp_reel.py
