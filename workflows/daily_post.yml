name: Daily PMP Post

on:
  schedule:
    - cron: '0 15 * * *'  # Runs daily at 8:00 AM PDT (3:00 PM UTC)
  workflow_dispatch:      # Allows manual trigger from GitHub

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run daily post script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          python -c "
          import os
          import requests
          from google import genai

          # Helper function to convert regular text to Unicode bold characters for Facebook
          def make_bold(text):
              normal = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
              bold = '𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵'
              return text.translate(str.maketrans(normal, bold))

          # Initialize Gemini client
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          # Prompt instructing Gemini with the revised cleaner CTA layout
          prompt = (
              'Create an engaging, high-energy PMP exam practice post optimized for social media.\n'
              'Use catchy emojis to make key sections stand out visually.\n\n'
              'Structure it exactly like this without using any markdown asterisks:\n'
              'PMP PRACTICE QUESTION OF THE DAY\n'
              '[Insert a realistic, scenario-based multiple-choice question here - Options A, B, C, D]\n\n'
              'CORRECT ANSWER:\n'
              '[Provide the correct option and letter]\n\n'
              'THE PMP MINDSET BREAKDOWN:\n'
              '[Brief, punchy explanation of why this is the correct answer and how to think like a PMI project manager]\n\n'
              'READY TO PASS YOUR PMP EXAM ON THE FIRST TRY?\n'
              'Join 50,000 other students from 180 countries in top-rated training with Master of Project Academy:\n'
              'https://masterofproject.com/'
          )

          response = client.models.generate_content(
              model='gemini-3.5-flash',
              contents=prompt,
          )
          ai_text = response.text

          # Apply Unicode bolding to all key headers and the multi-line CTA section
          header1 = '🚨 ' + make_bold('PMP PRACTICE QUESTION OF THE DAY') + ' 🚨'
          header2 = '✅ ' + make_bold('CORRECT ANSWER:')
          header3 = '🧠 ' + make_bold('THE PMP MINDSET BREAKDOWN:')
          cta_line1 = '👇 ' + make_bold('READY TO PASS YOUR PMP EXAM ON THE FIRST TRY?')
          cta_line2 = make_bold('Join 50,000 other students from 180 countries in top-rated training with Master of Project Academy:')

          # Replace plain text sections with our clean Unicode bold versions
          post_text = ai_text.replace('PMP PRACTICE QUESTION OF THE DAY', header1)
          post_text = ai_text.replace('CORRECT ANSWER:', header2)
          post_text = ai_text.replace('THE PMP MINDSET BREAKDOWN:', header3)
          post_text = post_text.replace('READY TO PASS YOUR PMP EXAM ON THE FIRST TRY?', cta_line1)
          post_text = post_text.replace('Join 50,000 other students from 180 countries in top-rated training with Master of Project Academy:', cta_line2)

          # Automatically exchange/refresh the Facebook token dynamically
          app_id = os.environ['FACEBOOK_APP_ID']
          app_secret = os.environ['FACEBOOK_APP_SECRET']
          current_token = os.environ['FACEBOOK_ACCESS_TOKEN']

          refresh_url = 'https://graph.facebook.com/v18.0/oauth/access_token'
          refresh_params = {
              'grant_type': 'fb_exchange_token',
              'client_id': app_id,
              'client_secret': app_secret,
              'fb_exchange_token': current_token
          }

          refresh_res = requests.get(refresh_url, params=refresh_params).json()

          if 'access_token' in refresh_res:
              active_token = refresh_res['access_token']
              print('Successfully refreshed token dynamically!')
          else:
              active_token = current_token
              print('Using existing token fallback.')

          # Post to Facebook Page Feed
          page_id = os.environ['FACEBOOK_PAGE_ID']
          post_url = f'https://graph.facebook.com/v18.0/{page_id}/feed'

          payload = {
              'message': post_text,
              'published': 'true',
              'access_token': active_token
          }

          res = requests.post(post_url, data=payload)
          print('Facebook Response:', res.json())
          "
