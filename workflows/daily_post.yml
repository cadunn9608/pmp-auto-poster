name: Daily PMP Facebook Auto-Poster

on:
  schedule:
    - cron: '0 15 * * *' # Runs daily at 3:00 PM UTC (8:00 AM PST)
  workflow_dispatch:

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests google-genai

      - name: Generate and Post Quiz via Gemini
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import requests
          from google import genai

          # Initialize Gemini client
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          # Prompt Gemini to generate the PMP post content
          prompt = '''
          Generate a daily PMP practice post containing 4 multiple-choice questions in the exact style of the actual PMP exam.
          Include options (A, B, C, D), the correct answer, and a clear mindset explanation for why it is correct.
          Use bold Unicode characters for headers and options so it stands out visually on social media.
          At the very bottom, add this exact affiliate link separator and text:
          ━━━━━━━━━━━━━━━━━━
          👉 **Launch your online business or prep journey today:** https://facebook.com/DailyPMPPrep
          Make sure the answers and explanations are separated near the bottom with scroll-down visual buffers like:
          .
          .
          🔽 **𝐒𝐂𝐑𝐎𝐋𝐋 𝐃𝐎𝐖𝐍 𝐅𝐎𝐑 𝐓𝐇𝐄 𝐀𝐍𝐒𝐖𝐄𝐑𝐒** 🔽
          .
          '''
          response = client.models.generate_content(
              model='gemini-3.5-flash',
              contents=prompt,
          )
          
          post_text = response.text

          # Post to Facebook Page Feed
          page_id = os.environ['FACEBOOK_PAGE_ID']
          token = os.environ['FACEBOOK_ACCESS_TOKEN']
          url = f'https://graph.facebook.com/v18.0/{page_id}/feed'
          
          payload = {
              'message': post_text,
              'published': 'true',
              'access_token': token
          }
          
          res = requests.post(url, data=payload)
          print('Facebook Response:', res.json())
          "
